version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pbl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pbl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbl_password}
      POSTGRES_DB: ${POSTGRES_DB:-pbl_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pbl_user} -d ${POSTGRES_DB:-pbl_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbl_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pbl_user}:${POSTGRES_PASSWORD:-pbl_password}@db:5432/${POSTGRES_DB:-pbl_db}
      JWT_SECRET: ${JWT_SECRET:-college_pbl_central_secure_secret_key_2026_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pbl_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
